name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build

      - name: Install Playwright browsers
        run: pwsh PlayWrightDemo.Tests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run tests
        run: dotnet test --no-build --settings .runsettings --logger trx --results-directory TestResults

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: TestResults
          retention-days: 30
